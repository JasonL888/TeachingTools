<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Disrupt Watermark</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container-fluid py-4 px-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title mb-4 text-center">Disrupt Watermark</h2>

        <div class="row g-3 mb-3">
          <div class="col-12 col-lg-6 d-flex flex-column">
            <label for="inputText" class="form-label">Original Text</label>
            <textarea id="inputText" class="form-control flex-grow-1" rows="14" placeholder="Paste original text here..."></textarea>
          </div>
          <div class="col-12 col-lg-6 d-flex flex-column">
            <label for="outputText" class="form-label">Disrupted Text</label>
            <textarea id="outputText" class="form-control flex-grow-1" rows="14" placeholder="Disrupted text will appear here..." readonly></textarea>
          </div>
        </div>

        <div id="statusLine" class="alert alert-secondary d-none mb-3"></div>

        <div id="modelProgress" class="progress mb-3 d-none" role="progressbar">
          <div id="modelProgressBar" class="progress-bar" style="width: 0%"></div>
        </div>

        <div class="row justify-content-center">
          <div class="col-12 col-md-8 d-flex flex-wrap gap-2 justify-content-center">
            <button id="disruptBtn" class="btn btn-primary">Disrupt</button>
            <button id="paraphraseBtn" class="btn btn-primary">Paraphrase</button>
            <button id="clearBtn" class="btn btn-danger">Clear</button>
            <button id="copyBtn" class="btn btn-outline-secondary">Copy Output</button>
          </div>
        </div>
        <p class="text-center text-muted small mt-2 mb-0">Paraphrase runs a small language model entirely in your browser (~275&nbsp;MB one-time download, cached after). No text ever leaves your device.</p>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
  <script type="module" src="./paraphrase.js"></script>
</body>
</html>
